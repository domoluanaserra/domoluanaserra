    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos Globais - Tons Terrosos & Moderno */
        :root {
            --bg-color: #f7f4ef;       /* Bege Claro */
            --card-bg: #ffffff;      /* Branco puro para o card */
            --primary: #2d3b2d;      /* Verde Musgo Profundo */
            --terracotta: #c86d51;   /* Terracota */
            --text: #3e3835;         /* Marrom Escuro Escuro */
            --text-light: #7a726d;   /* Marrom Suave */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* Cabeçalho */
        header {
            text-align: center;
        }

        header h1 {
            font-family: 'Marcellus', serif;
            font-size: 2.2rem;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            color: var(--terracotta);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Card Central do Calendário */
        .calendar-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(62, 56, 53, 0.08);
            width: 100%;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(200, 109, 81, 0.15);
        }

        .calendar-card h2 {
            font-family: 'Marcellus', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* Container do iFrame Responsivo */
        .iframe-wrapper {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        iframe {
            border: none;
            width: 100%;
            max-width: 800px;
            min-height: 460px;
            border-radius: 8px;
        }

        /* Rodapé com Ação para o WhatsApp */
        footer {
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-top: 1rem;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(45, 59, 45, 0.2);
        }

        .btn-whatsapp:hover {
            background-color: #212c21;
            transform: translateY(-2px);
        }

        .btn-whatsapp svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .copyright {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* Ajustes para telas pequenas (Celular) */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            .calendar-card {
                padding: 1rem;
            }
        }
    </style>
</head>
